[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers --ignore=tests/load"
markers = [
    "integration: needs real services and models (Qdrant, OpenSearch, Ollama, ML models)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations", "frontend", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
